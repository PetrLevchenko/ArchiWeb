<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="css/modern-normalize.css" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="img/free-icon-architecture-4539064.png">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
  <title>ArchiWeb</title>
</head>

<body>
  <div class="archiweb__full">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-sm" id="home">
      <div class="container-fluid menu">
        <a class="navbar-brand" href="index.html">
          <img src="img/LogoArchiWeb.png" alt="Написан логотип ArchiWeb">
        </a>
        <!-- Кнопка бургер -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mb-2 ms-auto mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active nav__menu__home" aria-current="page" href="#home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav__menu" href="#projects">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav__menu" href="#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav__menu" href="#contact">Contact</a>
            </li>
            <!-- Кнопка лупа с выпадающим поиском -->
            <li class="nav-item dropdown">
              <button class="btn nav-link " type="button" data-bs-toggle="dropdown" aria-expanded="false"
                aria-label="Открыть поиск">
                <img class="magnifier" src="img/Vector.svg" alt="Лупа">
              </button>
              <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 300px;">
                <form role="search">
                  <div class="input-group">
                    <input class="form-control" type="search" placeholder="Найти..." aria-label="Поиск по сайту">
                    <button class="btn btn-outline-secondary" type="submit">
                      <img class="magnifier-sm" src="img/Vector.svg" alt="Найти">
                    </button>
                  </div>
                </form>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Header -->
    <header class="header">
      <div class="header__background"></div>
      <div class="header__container">
        <div class="header__content">
          <h1 class="header__h1">Best Solution For<br>Your Home</h1>
          <p class="header__p">Lorem ipsum dolor sit amet,
            consectetur adipiscing elit ut
            aliquam, purus sit amet </p>
        </div>
      </div>
    </header>


  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
